name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}

jobs:
  # ─────────────────────────────────────────────
  # Frontend tests — all platforms
  # ─────────────────────────────────────────────
  test-frontend:
    name: Frontend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn --cwd apps/forgecut_gui/ui install --frozen-lockfile

      - name: Check formatting
        run: yarn --cwd apps/forgecut_gui/ui format:check

      - name: Lint TypeScript
        run: yarn --cwd apps/forgecut_gui/ui lint

      - name: Install media integration tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg bubblewrap fonts-dejavu-core

      - name: Run tests
        run: yarn --cwd apps/forgecut_gui/ui test --no-file-parallelism

      - name: Build frontend
        run: yarn --cwd apps/forgecut_gui/ui build

  # ─────────────────────────────────────────────
  # Electron build — Linux only
  # ─────────────────────────────────────────────
  build-electron-linux:
    name: Electron build (Linux)
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg bubblewrap fonts-dejavu-core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn --cwd apps/forgecut_gui/ui install --frozen-lockfile

      - name: Build renderer and Electron main
        run: yarn --cwd apps/forgecut_gui/ui build

      - name: Prepare offline graphics runtime
        run: yarn --cwd apps/forgecut_gui/ui build:graphic-runtime

      - name: Verify graphics rendering
        run: yarn --cwd apps/forgecut_gui/ui test:graphics

      - name: Verify Electron startup
        run: xvfb-run --auto-servernum yarn --cwd apps/forgecut_gui/ui verify:electron
        env:
          ELECTRON_DISABLE_SANDBOX: "1"

      - name: Build unpacked desktop application
        run: yarn --cwd apps/forgecut_gui/ui electron-builder --linux --dir --publish never

      - name: Verify packaged desktop application
        run: xvfb-run --auto-servernum yarn --cwd apps/forgecut_gui/ui verify:electron
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
          FORGECUT_VERIFY_EXECUTABLE: ${{ github.workspace }}/apps/forgecut_gui/ui/dist-installers/linux-unpacked/forgecut
